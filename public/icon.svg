<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#090d14"/>
      <stop offset="100%" stop-color="#040609"/>
    </radialGradient>

    <!-- Electric Blue Bell Gradient -->
    <linearGradient id="bellGrad" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="30%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Neon Glow Highlights -->
    <linearGradient id="bellHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <!-- Glowing Rim -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="calGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="126" fill="none" stroke="#00d2ff" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Ambient Light Reflection -->
  <ellipse cx="256" cy="140" rx="170" ry="90" fill="#00d2ff" opacity="0.12" filter="url(#neonGlow)"/>

  <!-- Bell Clapper Top Ring -->
  <circle cx="256" cy="120" r="28" fill="none" stroke="#00d2ff" stroke-width="12" filter="url(#neonGlow)"/>
  <circle cx="256" cy="120" r="28" fill="none" stroke="#e0f2fe" stroke-width="4"/>

  <!-- 3D Electric Blue Bell Body -->
  <g filter="url(#neonGlow)">
    <path d="M 256 145
             C 210 145, 175 190, 175 255
             C 175 295, 160 320, 135 345
             C 125 355, 130 370, 148 370
             L 364 370
             C 382 370, 387 355, 377 345
             C 352 320, 337 295, 337 255
             C 337 190, 302 145, 256 145 Z"
          fill="url(#bellGrad)"/>
  </g>

  <!-- Bell Inner Specular Shine -->
  <path d="M 256 150
           C 220 150, 190 190, 190 250
           C 190 280, 178 305, 160 325
           C 175 305, 195 270, 195 235
           C 195 185, 220 155, 256 152 Z"
        fill="url(#bellHighlight)"/>

  <!-- Bell Clapper Bottom Ball -->
  <circle cx="256" cy="385" r="30" fill="#0284c7" stroke="#00d2ff" stroke-width="6"/>
  <circle cx="250" cy="378" r="8" fill="#e0f2fe" opacity="0.8"/>

  <!-- Integrated Sleek Calendar Badge (Bottom Right) -->
  <g transform="translate(300, 290)">
    <!-- Shadow & Glow -->
    <rect x="-4" y="-4" width="148" height="148" rx="28" fill="#00d2ff" opacity="0.3" filter="url(#neonGlow)"/>
    <!-- Calendar Card Base -->
    <rect x="0" y="0" width="140" height="140" rx="24" fill="url(#calGrad)" stroke="#38bdf8" stroke-width="3"/>
    <!-- Header Bar -->
    <path d="M 0 24 Q 0 0, 24 0 L 116 0 Q 140 0, 140 24 L 140 42 L 0 42 Z" fill="#0284c7"/>
    <!-- Calendar Rings -->
    <circle cx="36" cy="18" r="5" fill="#e0f2fe"/>
    <circle cx="70" cy="18" r="5" fill="#e0f2fe"/>
    <circle cx="104" cy="18" r="5" fill="#e0f2fe"/>
    <!-- Day Number Text -->
    <text x="70" y="102" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" text-anchor="middle">20</text>
    <circle cx="106" cy="70" r="6" fill="#00d2ff"/>
  </g>
</svg>
